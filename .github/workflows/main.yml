name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]


permissions:
  checks: write

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        path: workspace/flow

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install node libraries
      working-directory: workspace/flow
      run: npm install

    - name: Run flow tests
      working-directory: workspace/flow
      run: npm test
